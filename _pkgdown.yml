url: https://sedzinfo.github.io/snp/

template:
  bootstrap: 5
  bootswatch: flatly
  math-rendering: katex   # renders the \eqn and \deqn maths of the help pages
  includes:
    # cookie banner and Google Analytics, shared by every site under sedzinfo.github.io (consent.js in that repository)
    after_body: '<script src="/consent.js" defer></script>'
  # the preview card that LinkedIn, Bluesky, Mastodon, Slack and others show when a page is shared:
  # pkgdown/assets/card.png (1200x630), which pkgdown copies to the root of the site
  opengraph:
    image:
      src: card.png
      alt: "snp: Plot standard normal distribution, with the normal curve and the z, T, percentile, sten, stanine, grade and IQ scales under it"

code:
  width: 200

destination: docs

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [sedzinfo, github]
  components:
    sedzinfo:
      icon: fas fa-house
      text: home
      href: https://sedzinfo.github.io/
      aria-label: sedzinfo home page
    github:
      icon: fab fa-github
      href: https://github.com/sedzinfo/snp
      aria-label: GitHub

footer:
  structure:
    left: sedzinfo
    right: sedzinfo_home
  components:
    sedzinfo: '[github.com/sedzinfo](https://github.com/sedzinfo) · [Cookie settings](#cookie-settings)'
    sedzinfo_home: '[home](https://sedzinfo.github.io/)'
